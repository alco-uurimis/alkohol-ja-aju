name: Diagnose research API

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel deployment and check health
        shell: bash
        run: |
          set -u
          endpoint="https://alkohol-ja-aju.vercel.app/api/research-health"
          echo "Checking $endpoint"
          for attempt in $(seq 1 15); do
            echo "Attempt $attempt/15"
            code=$(curl -L -sS --max-time 20 -o health.json -w "%{http_code}" "$endpoint" || true)
            echo "HTTP $code"
            cat health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && grep -q 'research-delivery' health.json 2>/dev/null; then
              echo "Research health endpoint is live."
              exit 0
            fi
            sleep 10
          done
          echo "Health endpoint did not become available in time."
          exit 1
