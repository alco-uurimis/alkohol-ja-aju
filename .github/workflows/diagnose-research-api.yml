name: Diagnose research API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production research health
        shell: bash
        run: |
          set -u
          endpoint="https://alkohol-ja-aju.vercel.app/api/research-health"
          echo "Checking $endpoint"
          code=$(curl -L -sS --max-time 20 -o health.json -w "%{http_code}" "$endpoint" || true)
          echo "HTTP $code"
          cat health.json 2>/dev/null || true
          echo
          test "$code" = "200"
          grep -q 'research-delivery' health.json
